# 研究范围与数据口径（Project1 数据模块）
#
# 本仓库支持两种数据模式，清洗层只关心 data/raw/stocks/*.csv 的格式，两种模式产物一致：
#   1) 快照模式（本文件当前值）：scripts/fetch_data.py（akshare/sina）抽样的 50 只，
#      用于小样本快速复现；**成分名单为当期快照，非 point-in-time**。
#   2) PIT 模式（README §1 主推）：scripts/fetch_data_tushare.py 抓 HS300/ZZ500/ZZ1000
#      期内的 PIT 成分并集（约 2800 只，2020 起）——此时请在 overrides 或本文件把
#      universe.name 改为 tushare_pit，并按实际抓取区间改 period。
# 改这里不会自动改数据：请重跑 scripts/run_pipeline.py（清洗缓存按区间/哈希自动失效）。
universe:
  name: csi300_sample50
  rule: "快照模式：沪深300当期成分，按代码升序步长抽样50只（确定性，可复现）"
  size: 50
  pit_limitation: "快照模式成分名单为当期快照，未做 point-in-time；PIT 模式用 data/reference/universe_intervals.csv 逐日判定"

period:
  start: "2022-01-04"
  end: "2025-12-31"

source:
  library: akshare
  endpoints:
    daily: stock_zh_a_daily         # sina，日频原始行情（未复权），eastmoney 兜底
    adj_factor: stock_zh_a_daily    # sina，hfq 乘法累计复权因子
    benchmark: stock_zh_index_daily # sina，沪深300 指数
  frequency: "日频（每交易日一行）"
  units:
    price: "元（原始未复权价）"
    volume: "股（sina 口径）"
    amount: "元"
    turnover_rate: "比例（sina 口径，0-1）"

adjustment:
  convention: "乘法累计因子"
  formula: "P_adj(t) = P_raw(t) * a(t) / a(tau)"
  reference: "tau = 样本首日（每只股票各自样本窗口内首个有因子值的交易日）"
  note: "原始价与因子分别保存于 data/raw；不同参考日期的价格片段不拼接"

risk_free_annual: 0.015   # 无风险收益假设（年化），文档化假设，非市场数据
trading_days_per_year: 243  # A股年化因子 A
