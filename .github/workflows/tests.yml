name: tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CI 精简依赖：不装 torch/sb3-contrib/tushare/akshare/matplotlib（各自被
      # importorskip 守卫或仅脚本使用），目标是在干净环境守住核心计算正确性
      - name: Install dependencies (slim)
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2" "numpy>=1.26" scipy pyyaml "sqlalchemy>=2.0" \
            "pyarrow>=20" fastapi "uvicorn>=0.29" jinja2 python-multipart httpx pytest
      - name: Run tests
        run: python -m pytest tests/ -q
