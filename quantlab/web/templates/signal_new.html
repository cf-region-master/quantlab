{% extends "base.html" %}
{% block content %}
<div class="crumb"><a href="/signals">策略</a> / 新建信号</div>
<h1>新建信号（策略）</h1>

<form class="panel" method="post" action="/signals/new" id="sigForm">
  <div class="grid2">
    <div><label>信号名称 *</label><input name="name" required maxlength="80" placeholder="例如：低波动+动量（等权）"></div>
    <div><label>描述</label><input name="description" maxlength="200" placeholder="可选"></div>
  </div>

  <div>
    <label>因子分量（1 ~ 10 个）<span class="muted" id="selCount">已选 0 个</span></label>
    {% if factors %}
    <div class="checklist">
      {% for f in factors %}
      {% set m = mets.get(f.id) %}
      <label>
        <input type="checkbox" name="factor_ids" value="{{ f.id }}"
          data-vstart="{{ f.value_start.strftime('%Y-%m-%d') if f.value_start else '' }}"
          {% if f.id in preselect %}checked{% endif %}>
        <span><b>{{ f.name }}</b> <span class="badge {{ f.source }}">{{ f.source }}</span>
          <span class="meta">
            {%- if m and m.rank_ic_mean is not none %} · RankIC(20d)={{ '%+.4f'|format(m.rank_ic_mean) }}{% endif %}
            {%- if f.value_start %} · {{ f.value_start.strftime('%Y-%m-%d') }}~{{ f.value_end.strftime('%Y-%m-%d') }}{% endif %}
          </span>
        </span>
      </label>
      {% endfor %}
    </div>
    {% else %}<div class="empty">因子库为空。</div>{% endif %}

  <div id="corrBox" style="display:none; margin-top:14px;">
    <div class="k">因子相关性与去冗余建议（组合前体检）</div>
    <div id="corrChart" class="chart" style="height:320px; margin-top:8px;"></div>
    <div id="corrSuggest" class="muted" style="margin-top:6px;"></div>
  </div>
  <script>
  const factorSelect = document.querySelector('select[name="factor_ids"]');
  if (factorSelect) {
    let timer = null;
    factorSelect.addEventListener('change', ()=>{
      clearTimeout(timer);
      timer = setTimeout(async ()=>{
        const ids = Array.from(factorSelect.selectedOptions).map(o=>o.value);
        if (ids.length < 2) { document.getElementById('corrBox').style.display='none'; return; }
        const r = await fetch('/api/factors/correlation?ids=' + ids.join(','));
        if (!r.ok) return;
        const j = await r.json();
        document.getElementById('corrBox').style.display = '';
        const names = j.factors.map(f=>f.name.length>10 ? f.name.slice(0,10)+'…' : f.name);
        const data = [];
        j.matrix.forEach((row,i)=>row.forEach((v,jj)=>{ if(i<jj && v!=null) data.push([jj,i,Math.round(v*1000)/1000]); }));
        echarts.init(document.getElementById('corrChart')).setOption({
          title:{text:'因子池化相关矩阵', textStyle:{fontSize:13}, left:'center'},
          tooltip:{}, grid:{height:'62%', top:'18%'},
          xAxis:{type:'category', data:names, axisLabel:{rotate:30, fontSize:10}},
          yAxis:{type:'category', data:names, axisLabel:{fontSize:10}},
          visualMap:{min:-1, max:1, calculable:true, orient:'horizontal', left:'center', bottom:0,
                     inRange:{color:['#1a5fb4','#fff','#b3261e']}},
          series:[{type:'heatmap', data,
                   label:{show:j.matrix.length<=6, formatter:p=>p.value[2]}}]
        }, true);
        const d = j.redundancy;
        let msg = '建议保留：' + (d.keep.join('、') || '（无）');
        if (d.drop.length) msg += '；建议剔除：' + d.drop.map(x=>`${x.key}（与 ${x.vs} 相关 ${x.corr}）`).join('、');
        msg += `（阈值 |ρ|≥${d.threshold}，按 |RankIC| 降序贪心保留）`;
        // 增量 IC（Schmidt 正交化分解）：排后面的因子只保留前面解释不掉的信息
        try {
          const r2 = await fetch('/api/factors/incremental-ic?ids=' + ids.join(',') + '&horizon=5');
          if (r2.ok) {
            const j2 = await r2.json();
            const parts = j2.order.map(o=>{
              const v = j2.incremental_rank_ic[String(o.id)];
              return `${o.name} ${v==null?'NaN':(v>0?'+':'')+v.toFixed(4)}`;
            });
            msg += '<br>增量 RankIC（正交化分解，顺序=选择顺序）：' + parts.join('、');
          }
        } catch(e) {}
        document.getElementById('corrSuggest').innerHTML = msg;
      }, 400);
    });
  }
  </script>
  </div>

  <div class="grid2">
    <div><label>组合模型</label>
      <select name="model_type" id="modelType">
        <option value="equal_weight">equal_weight 等权</option>
        <option value="ic_weight">ic_weight 全样本 RankIC 加权（基线，含轻微样本内偏误）</option>
        <option value="ic_weight_rolling">ic_weight_rolling 滚动 ICIR 加权（walk-forward，推荐）</option>
        <option value="ic_inversevol_rolling">ic_inversevol_rolling IC 逆波动率（ICIR 稳健变体）</option>
        <option value="ic_meanvar">ic_meanvar IC 均值-方差凸组合（walk-forward，推荐）</option>
        <option value="ortho_ic_weight_rolling">ortho 正交化 + 滚动 ICIR（消除共线性，按分量顺序保留信息）</option>
        <option value="linear">linear 线性模型（截面回归）</option>
        <option value="tree">tree 决策树 / GBDT</option>
      </select></div>
    <div><label>有效区间 [a, b] *（回测只能落在此区间内）</label>
      <div class="flex">
        <input type="date" name="start_date" id="startDate" required value="{{ data_start }}" min="{{ data_start }}" max="{{ data_end }}" style="flex:1">
        <span class="muted">~</span>
        <input type="date" name="end_date" required value="{{ data_end }}" min="{{ data_start }}" max="{{ data_end }}" style="flex:1">
      </div></div>
  </div>

  <div id="modelParams" style="display:none">
    <label>模型参数（仅 linear / tree 需要）</label>
    <div class="grid3">
      <div><label>多久重新拟合一次（交易日）</label><input type="number" name="refit_days" value="20" min="1" max="250"></div>
      <div><label>用之前多久的数据拟合（交易日）</label><input type="number" name="train_window" value="252" min="20" max="1500"></div>
      <div><label>标签 purge（交易日）</label><input type="number" name="purge" value="5" min="0" max="60"></div>
    </div>
  </div>

  <div class="form-hint" id="needHint"></div>
  <div><button class="btn" type="submit" id="submitBtn">创建信号</button> <a class="btn ghost" href="/signals">取消</a></div>
</form>

<script>
const form = document.getElementById('sigForm');
const boxes = Array.from(document.querySelectorAll('input[name="factor_ids"]'));
const cnt = document.getElementById('selCount'), btn = document.getElementById('submitBtn');
const mt = document.getElementById('modelType'), mp = document.getElementById('modelParams');
const hint = document.getElementById('needHint'), sd = document.getElementById('startDate');
const DATA_START = {{ data_start|tojson }};
const FAC_MIN = {{ fac_min_start|tojson }};      // 所选因子中最晚的起始覆盖

function sync(){
  const n = boxes.filter(b=>b.checked).length;
  cnt.textContent = '已选 ' + n + ' 个';
  const bad = n < 1 || n > 10;
  cnt.className = n ? (bad ? 'neg' : 'pos') : 'muted';
  btn.disabled = bad;
  syncModel();
}
function minStart(){
  const picked = boxes.filter(b=>b.checked).map(b=>b.dataset.vstart).filter(Boolean).sort();
  return picked.length ? picked[picked.length-1] : FAC_MIN;   // 取最晚的
}
function syncModel(){
  const n = boxes.filter(b=>b.checked).length;
  if (!n){ hint.textContent = ''; return; }
  const needs = (mt.value === 'linear' || mt.value === 'tree');
  mp.style.display = needs ? 'block' : 'none';
  const a = sd.value || DATA_START;
  if (!needs){
    hint.textContent = '因子覆盖 ' + minStart() + ' ~ ' + {{ data_end|tojson }} + '；等权 / IC 加权不需要预热窗口。';
    return;
  }
  const need = (+form.train_window.value || 0) + (+form.purge.value || 0);
  const d = new Date(a); d.setDate(d.getDate() - Math.round(need * 1.6));  // 自然日近似
  const needStr = d.toISOString().slice(0,10);
  const have = minStart();
  const ok = have && have <= needStr;
  hint.innerHTML = '拟合需要覆盖到 <b>' + needStr + '</b>（a − ' + need + ' 交易日）；'
    + '所选因子最早 <b>' + have + '</b> '
    + (ok ? '<b class="pos">满足</b>' : '<b class="neg">不足，提交会被拒绝</b>');
}
boxes.forEach(b=>b.addEventListener('change', sync));
mt.addEventListener('change', syncModel);
sd.addEventListener('change', syncModel);
['refit_days','train_window','purge'].forEach(n=>form[n].addEventListener('input', syncModel));
form.addEventListener('submit',(ev)=>{
  const n = boxes.filter(b=>b.checked).length;
  if (n<1 || n>10){ ev.preventDefault(); alert('请选择 1~10 个因子（当前 '+n+' 个）'); }
});
sync();
</script>
{% endblock %}
