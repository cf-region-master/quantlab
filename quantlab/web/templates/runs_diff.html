{% extends "base.html" %}
{% block content %}
<div class="crumb"><a href="/runs">研究记录</a> / Manifest 差异</div>
<h1>Run 对比：{{ a }} vs {{ b }}</h1>
<p class="muted">共 {{ n }} 处差异（仅列出值不同的键；嵌套 dict 以路径展开）。两 run 的代码版本指纹差异代表代码变更，配置差异代表实验参数不同。</p>
<table class="grid">
  <thead><tr><th>路径</th><th>{{ a }}</th><th>{{ b }}</th></tr></thead>
  <tbody>
  {% for d in diffs %}
  <tr><td class="mono">{{ d.path }}</td>
      <td class="mono">{{ d.a }}</td><td class="mono">{{ d.b }}</td></tr>
  {% endfor %}
  </tbody>
</table>
<p><a class="btn ghost" href="/runs">← 返回研究记录</a></p>
{% endblock %}
