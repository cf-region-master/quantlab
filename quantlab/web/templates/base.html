<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}QuantLab · 量化因子挖掘平台{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/echarts.min.js"></script>
<script>
// ECharts 兜底：个别图在容器布局完成前 init（canvas 宽 0 且永不恢复）。
// load 后对已知注册表的每个实例 resize 一次；各页面把实例塞进
// window.__qcCharts（数组）即可被覆盖到。
window.__qcCharts = window.__qcCharts || [];
// 实测：异步回调里 init 的图可能撞上 body 宽度还是 0 的时刻（load 前后都可能），
// 一次性 resize 救不回来 —— 逐帧等到容器有宽度再 resize，最多约 2 秒。
window.qcFit = function (c) {
  if (!c || !c.resize) return;
  var tries = 0;
  (function go() {
    try {
      if (c.isDisposed()) return;
      var d = c.getDom();
      if (d && d.clientWidth > 0) { c.resize(); return; }
    } catch (e) {}
    // 注意：隐藏标签页里 requestAnimationFrame 会被暂停，必须用 setTimeout
    if (++tries < 100) setTimeout(go, 120);
  })();
};
window.addEventListener('load', function () {
  setTimeout(function () {
    window.__qcCharts.forEach(function (c) { try { window.qcFit(c); } catch (e) {} });
  }, 0);
});
</script>
</head>
<body>
{% set path = request.url.path if request else '/' %}
<nav class="nav">
  <div class="brand">QuantLab <span class="sub">量化投研框架 · Project1</span></div>
  <div class="links">
    <a href="/" class="{{ 'active' if path == '/' else '' }}">总览</a>
    <a href="/factors" class="{{ 'active' if path.startswith('/factors') else '' }}">因子库</a>
    <a href="/pools" class="{{ 'active' if path.startswith('/pools') else '' }}">股票池</a>
    <a href="/signals" class="{{ 'active' if path.startswith('/signals') else '' }}">策略</a>
    <a href="/backtests" class="{{ 'active' if path.startswith('/backtests') else '' }}">回测</a>
    <a href="/lab" class="{{ 'active' if path.startswith('/lab') else '' }}">算法实验室</a>
    <a href="/experiments" class="{{ 'active' if path.startswith('/experiments') else '' }}">组合实验</a>
    <a href="/runs" class="{{ 'active' if path.startswith('/runs') else '' }}">研究记录</a>
  </div>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer class="foot">
  数据口径：真实 A 股日线（主源 Tushare，见 <code>data/raw/manifest.json</code>）·
  股票池为逐日 PIT 指数成分（见 <code>data/reference/</code>）·
  调整价 = 原始价 × 复权因子比 · 缺失值不填零
</footer>
</body>
</html>
